name: Agent evaluation

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Exact scenario name. Leave blank for the full suite.
        type: string

permissions:
  contents: read

concurrency:
  group: agent-evaluation
  cancel-in-progress: false

jobs:
  claude:
    if: github.ref == 'refs/heads/main' && vars.KANSO_EVAL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Run paired scenarios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          test -n "$ANTHROPIC_API_KEY"
          mkdir -p "$RUNNER_TEMP/kanso-eval"
          args=(
            --eval-dir tests/scenarios --runs 2
            --model haiku --judge-model haiku --concurrency 2 --max-cost-usd 3
            --ablation with-without --no-publish --trust-plugin
            --output-dir "$RUNNER_TEMP/kanso-eval"
            --json "$RUNNER_TEMP/kanso-eval/results.json"
            --report "$RUNNER_TEMP/kanso-eval/report.html"
          )
          if [[ -n "$SCENARIO" ]]; then
            [[ "$SCENARIO" =~ ^[a-z][a-z-]*$ ]]
            test -f "tests/scenarios/$SCENARIO/prompt.md"
            args+=(--case "$SCENARIO")
          fi
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.292 -- claude plugin eval . "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kanso-agent-evaluation
          path: ${{ runner.temp }}/kanso-eval/
          if-no-files-found: warn
          retention-days: 7
