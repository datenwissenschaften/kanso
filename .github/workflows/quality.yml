name: Quality

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.30"
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Validate format and skill metadata
        run: |
          npx --yes prettier@3.8.1 --check '**/*.md' '.github/*.md' '.github/**/*.yml' '.github/plugin/*.json' '.agents/plugins/*.json' '.claude-plugin/*.json' '.codex-plugin/*.json' 'hooks/*.json' package.json tests/distribution.test.mjs
          uvx --python 3.13 --from 'git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref' skills-ref validate skills/kanso
          node --test tests/distribution.test.mjs
      - name: Verify required files and resource discovery
        shell: bash
        run: |
          required=(
            skills/kanso/SKILL.md README.md LICENSE CHANGELOG.md CONTRIBUTING.md
            skills/kanso/references/{automation,security-and-design,testing,dependencies,architecture,data-and-ai}.md
            skills/kanso/profiles/{python,typescript,rust,go,java}.md
            tests/scenarios/README.md .github/workflows/quality.yml
            .agents/plugins/marketplace.json .codex-plugin/plugin.json
            .claude-plugin/{marketplace,plugin}.json .github/plugin/{marketplace,plugin}.json
            hooks/hooks.json package.json
          )
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty: $file" >&2
              exit 1
            fi
          done
          cd skills/kanso
          for resource in references/*.md profiles/*.md; do
            grep -Fq "]($resource)" SKILL.md || { echo "Unlinked resource: $resource" >&2; exit 1; }
          done
      - name: Smoke-test the Copilot marketplace
        env:
          COPILOT_AUTO_UPDATE: "false"
        run: |
          export COPILOT_HOME="$(mktemp -d)"
          npm exec --yes --package=@github/copilot@1.0.116 -- copilot plugin marketplace add "$GITHUB_WORKSPACE"
          npm exec --yes --package=@github/copilot@1.0.116 -- copilot plugin install kanso@kanso
          npm exec --yes --package=@github/copilot@1.0.116 -- copilot plugin list --json |
            jq -e '.[] | select(.name == "kanso" and .marketplace == "kanso" and .enabled)'
      - name: Verify links, workflow, and secrets
        shell: bash
        run: |
          tools="$(mktemp -d)"
          cd "$tools"

          curl -fsSLo lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256sum --check <<'CHECKSUMS'
          1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tar.gz
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz
          CHECKSUMS
          tar -xzf lychee.tar.gz lychee-x86_64-unknown-linux-gnu/lychee
          tar -xzf actionlint.tar.gz actionlint
          tar -xzf gitleaks.tar.gz gitleaks

          cd "$GITHUB_WORKSPACE"
          "$tools/lychee-x86_64-unknown-linux-gnu/lychee" --offline '*.md' '.github/*.md' 'docs/*.md' 'skills/**/*.md' 'tests/scenarios/**/*.md'
          "$tools/actionlint"
          "$tools/gitleaks" git --redact --log-opts=--all
          "$tools/gitleaks" dir --redact .
      - name: Build and inspect distribution archives
        run: |
          version="$(node -p 'require("./package.json").version')"
          stage="$(mktemp -d)"
          mkdir -p dist
          cp -R skills/kanso "$stage/"
          cp LICENSE "$stage/kanso/"
          epoch="$(git show -s --format=%ct HEAD)"
          find "$stage/kanso" -exec touch -d "@$epoch" {} +
          (cd "$stage" && find kanso -type f | LC_ALL=C sort | TZ=UTC zip -Xq "$GITHUB_WORKSPACE/dist/kanso.zip" -@)
          npm pack --ignore-scripts --pack-destination dist
          tar -xzf "dist/kanso-skill-$version.tgz" -C "$stage"
          unzip -t dist/kanso.zip
          unzip -q dist/kanso.zip -d "$stage/extracted"
          diff -r skills/kanso "$stage/package/skills/kanso"
          cmp LICENSE "$stage/package/LICENSE"
          diff -r "$stage/kanso" "$stage/extracted/kanso"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kanso-distribution
          path: |
            dist/kanso.zip
            dist/kanso-skill-*.tgz
          if-no-files-found: error
          retention-days: 7
