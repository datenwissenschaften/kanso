name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kanso-distribution
          path: dist
      - name: Verify deliverables without publishing
        run: |
          unzip -t dist/kanso.zip
          shopt -s failglob
          archives=(dist/kanso-skill-*.tgz)
          test "${#archives[@]}" = 1
          tar -tzf "${archives[0]}" > "$RUNNER_TEMP/npm-files"
          grep -Fx package/skills/kanso/SKILL.md "$RUNNER_TEMP/npm-files"
          sha256sum dist/kanso.zip "${archives[0]}"

  github-release:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kanso-distribution
          path: dist
      - name: Publish the verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "dist/kanso-skill-${TAG#v}.tgz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            previous="$(mktemp -d)"
            gh release download "$TAG" --pattern kanso.zip --dir "$previous"
            cmp dist/kanso.zip "$previous/kanso.zip"
          else
            gh release create "$TAG" dist/kanso.zip --verify-tag --generate-notes
          fi
